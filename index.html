/* --- Sanasade --- */
function gRain() {
  const p = needPool(6, ["N", "A", "V", "X"]); if (!p) return;
  const words = p.filter(w => typable(w) && shortFi(w.fi));
  const v = gameShell("Sanasade", `<div class="arena" id="arena"><div class="hud"><span id="rScore">0</span><span class="hearts" id="rHearts"></span></div><div class="ground"></div>
  <div class="overlay" id="rOver"><div><h2 style="font-size:28px">Sanasade</h2><p class="muted" style="max-width:40ch">Suomenkieliset sanat putoavat. Kirjoita sana viroksi ja paina Enter. Tarkkeet saa jättää pois, mutta niistä saa lisäpisteitä.</p><button class="btn primary" id="rStart">Aloita</button></div></div></div>
  <form class="answer" id="rForm" autocomplete="off"><input id="rIn" aria-label="Kirjoita viroksi" placeholder="kirjoita viroksi…" autocapitalize="off" spellcheck="false"><button class="btn primary">OK</button></form>
  <div class="letters">${["õ", "ä", "ö", "ü"].map(c => `<button type="button" data-ch="${c}">${c}</button>`).join("")}</div>`);
  quitTo(); $("#gBest").textContent = "Ennätys " + (state.best.rain || 0);
  const arena = $("#arena"), inp = $("#rIn");
  $$(".letters button", v).forEach(b => b.onclick = () => { inp.value += b.dataset.ch; inp.focus(); });
  let G;
  const hearts = () => $("#rHearts").innerHTML = Array.from({ length: G.lives }, () => IC.heart).join("");
  function start() {
    G = { items: [], score: 0, lives: 3, hits: 0, t0: performance.now(), last: 0, spawnEvery: 2700, fall: 10000, run: true, xp: 0 };
    $("#rOver").hidden = true; hearts(); $("#rScore").textContent = 0; inp.value = ""; inp.focus();
    requestAnimationFrame(loop);
  }
  function spawn(now) {
    const w = pick(words); const el = document.createElement("div"); el.className = "fall"; el.textContent = shortFi(w.fi);
    el.style.left = (12 + Math.random() * 76) + "%"; arena.appendChild(el);
    G.items.push({ w, el, born: now, dur: G.fall * (0.85 + Math.random() * .3) });
  }
  function loop(now) {
    if (!G.run) return;
    if (now - G.last > G.spawnEvery) { spawn(now); G.last = now; }
    const H = arena.clientHeight - 48;
    for (const it of G.items.slice()) {
      const k = (now - it.born) / it.dur; it.el.style.top = (k * H) + "px";
      if (k >= 1) {
        it.el.remove(); G.items = G.items.filter(x => x !== it); G.lives--; hearts(); sfx("bad");
        toast(`${shortFi(it.w.fi)} = ${mainEt(it.w)}`); srsTouch(it.w.id, false);
        if (G.lives <= 0) return end();
      }
    }
    requestAnimationFrame(loop);
  }
  function end() {
    G.run = false; G.items.forEach(i => i.el.remove());
    const rec = (state.best.rain || 0) < G.score; setBest("rain", G.score); if (rec && G.score) confetti(120);
    addXP(Math.round(G.score / 4));
    $("#rOver").hidden = false;
    $("#rOver").innerHTML = `<div><div class="eyebrow">Peli päättyi</div><div class="score" style="font-size:52px;font-weight:700">${G.score}</div><p class="muted">${rec ? "Uusi ennätys!" : "Ennätys " + state.best.rain} · ${G.hits} sanaa</p><button class="btn primary" id="rStart">Uudestaan</button></div>`;
    $("#rStart").onclick = start; $("#gBest").textContent = "Ennätys " + state.best.rain;
  }
  $("#rStart").onclick = start;
  $("#rForm").onsubmit = e => {
    e.preventDefault(); if (!G || !G.run) return;
    const val = inp.value; if (!val.trim()) return;
    const hit = G.items.slice().sort((a, b) => (performance.now() - b.born) / b.dur - (performance.now() - a.born) / a.dur).find(it => variants(it.w.et).map(loose).includes(loose(val)));
    if (hit) {
      const exact = variants(hit.w.et).includes(norm(val));
      G.items = G.items.filter(x => x !== hit); hit.el.classList.add("hit"); setTimeout(() => hit.el.remove(), 260);
      G.hits++; G.score += exact ? 15 : 10; $("#rScore").textContent = G.score; sfx("ok"); srsTouch(hit.w.id, true);
      if (G.hits % 6 === 0) { G.spawnEvery = Math.max(1100, G.spawnEvery - 260); G.fall = Math.max(4800, G.fall - 700); toast("Vauhti kiihtyy!"); }
      inp.value = "";
    } else { inp.classList.add("shake"); setTimeout(() => inp.classList.remove("shake"), 350); sfx("bad"); }
  };
  Game.stop = () => { if (G) G.run = false; };
}

/* --- Muistipeli --- */
function gMemory() {
  const p = needPool(8, ["N", "A", "V", "X"]); if (!p) return;
  const seen = new Set(); const sel = [];
  for (const w of shuffle(p)) { const k = shortFi(w.fi); if (!k || seen.has(k) || seen.has(w.et) || w.et.length > 16) continue; seen.add(k); seen.add(w.et); sel.push(w); if (sel.length === 8) break; }
  const cards = shuffle(sel.flatMap((w, i) => [{ i, txt: w.et, et: 1 }, { i, txt: shortFi(w.fi), et: 0 }]));
  const v = gameShell("Muistipeli", `<div class="row" style="justify-content:center;margin-bottom:12px"><span class="pill" id="mTime">0 s</span><span class="pill" id="mMoves">0 siirtoa</span></div><div class="memgrid" id="mGrid">${cards.map((c, k) => `<button class="mcard" data-k="${k}" aria-label="Kortti">${FLOWER()}</button>`).join("")}</div>`);
  quitTo(); $("#gBest").textContent = state.best.memory ? "Ennätys " + state.best.memory + " s" : "Ei ennätystä";
  let open = [], moves = 0, done = 0, t0 = 0, lock = false;
  const tick = setInterval(() => { if (t0) $("#mTime").textContent = Math.round((Date.now() - t0) / 1000) + " s"; }, 500);
  Game.stop = () => clearInterval(tick);
  $("#mGrid").onclick = e => {
    const b = e.target.closest(".mcard"); if (!b || lock || b.classList.contains("open")) return;
    if (!t0) t0 = Date.now();
    const c = cards[+b.dataset.k]; b.classList.add("open"); if (c.et) b.classList.add("et"); b.textContent = c.txt;
    if (c.et) speak(c.txt);
    open.push(b);
    if (open.length === 2) {
      moves++; $("#mMoves").textContent = moves + " siirtoa";
      const [a, d] = open.map(x => cards[+x.dataset.k]);
      if (a.i === d.i) { open.forEach(x => x.classList.add("done")); open = []; done++; sfx("ok"); if (done === 8) win(); }
      else { lock = true; sfx("bad"); setTimeout(() => { open.forEach(x => { x.classList.remove("open", "et"); x.innerHTML = FLOWER(); }); open = []; lock = false; }, 900); }
    }
  };
  function win() {
    clearInterval(tick); const s = Math.round((Date.now() - t0) / 1000);
    const prev = state.best.memory; setBest("memory", s, true); addXP(30); confetti(110);
    const g = $("#mGrid"); g.insertAdjacentHTML("afterend", `<div class="panel result" style="margin-top:16px"><div class="eyebrow">Kaikki parit löytyivät</div><div class="score">${s} s</div><p class="muted">${moves} siirtoa${prev === undefined || s < prev ? " · uusi ennätys!" : ""}</p><button class="btn primary" id="mAgain">Uusi peli</button></div>`);
    $("#mAgain").onclick = gMemory;
  }
}

/* --- Lumiukko sulaa (hirsipuu) --- */
const ALPHA = "abdefghijklmnoprsštuvõäöüzž".split("");
function snowSVG(miss) {
  const parts = [
    `<path d="M70 38h60v8H70zM82 10h36v30H82z" fill="var(--ink)"/>`, // hat
    `<path d="M62 98 L28 74 M28 74 l-6 -10 M28 74 l-10 -2" stroke="var(--muted)" stroke-width="4" fill="none" stroke-linecap="round"/>`, // left arm
    `<path d="M138 98 L172 74 M172 74 l6 -10 M172 74 l10 -2" stroke="var(--muted)" stroke-width="4" fill="none" stroke-linecap="round"/>`, // right arm
    `<path d="M74 84 q26 12 52 0 l0 8 q-26 12 -52 0z M112 90 l6 28 l9 -2 l-6 -26z" fill="var(--bad)"/>`, // scarf
    `<path d="M100 66 l22 5 l-22 4z" fill="var(--wheat)"/>`, // nose
    `<circle cx="90" cy="60" r="4" fill="var(--ink)"/><circle cx="110" cy="60" r="4" fill="var(--ink)"/>`, // eyes
    `<circle cx="100" cy="64" r="24" fill="var(--surface)" stroke="var(--line)" stroke-width="3"/>` // head
  ];
  const body = `<circle cx="100" cy="150" r="42" fill="var(--surface)" stroke="var(--line)" stroke-width="3"/><circle cx="100" cy="132" r="4" fill="var(--ink)"/><circle cx="100" cy="150" r="4" fill="var(--ink)"/><circle cx="100" cy="168" r="4" fill="var(--ink)"/>`;
  const shown = parts.slice(0, 7 - miss);
  const melt = miss >= 7 ? `<ellipse cx="100" cy="196" rx="70" ry="10" fill="var(--blue-soft)"/>` : `<ellipse cx="100" cy="194" rx="${50 + miss * 3}" ry="${5 + miss}" fill="var(--blue-soft)"/>`;
  const sunR = 10 + miss * 3;
  return `<svg class="snow" viewBox="0 0 200 210" width="200" height="210" aria-hidden="true"><circle cx="176" cy="22" r="${sunR}" fill="var(--wheat)" opacity=".85"/>${melt}${miss >= 7 ? "" : body}${shown.slice().reverse().join("")}</svg>`;
}
function gSnow(streakN = 0) {
  const p = needPool(3, ["N", "A", "V"]); if (!p) return;
  const cand = p.filter(w => w.et.length >= 4 && w.et.length <= 11 && [...w.et].every(c => ALPHA.includes(c)));
  if (!cand.length) { toast("Ei sopivia sanoja"); return; }
  const w = pick(cand), word = w.et;
  const v = gameShell("Lumiukko sulaa", `<div class="panel" style="padding:22px"><div class="hang"><div id="sSnow">${snowSVG(0)}</div>
  <div><div class="eyebrow">Vihje</div><p style="font-size:20px;font-weight:600;margin:4px 0 14px">${esc(noteFi(w.fi))} <span class="tag ${w.t}">${TYPE_FI[w.t]}</span></p>
  <div class="slots" id="sSlots"></div><div class="kbd" id="sKbd">${ALPHA.map(c => `<button data-c="${c}">${c}</button>`).join("")}</div><div class="feedback" id="sFb"></div></div></div></div>`);
  quitTo(); $("#gBest").textContent = "Voittoputki " + streakN + (state.best.snow ? " · ennätys " + state.best.snow : "");
  const got = new Set(); let miss = 0, over = false;
  const draw = () => { $("#sSlots").innerHTML = [...word].map(c => `<span>${got.has(c) ? c : "&nbsp;"}</span>`).join(""); };
  draw();
  function guess(c) {
    if (over || got.has(c) || $(`#sKbd [data-c="${c}"]`).disabled) return;
    const b = $(`#sKbd [data-c="${c}"]`); b.disabled = true;
    if (word.includes(c)) { got.add(c); b.classList.add("hit"); sfx("pop"); }
    else { miss++; b.classList.add("miss"); sfx("bad"); $("#sSnow").innerHTML = snowSVG(miss); }
    draw();
    if ([...word].every(x => got.has(x))) {
      over = true; const s = streakN + 1; setBest("snow", s); addXP(20); sfx("ok"); confetti(80); speak(word); srsTouch(w.id, true);
      $("#sFb").className = "feedback good"; $("#sFb").innerHTML = `Pelastit lumiukon! <span class="sol">${esc(word)}</span><span class="why">${esc(formsList(w).map(x => x[1]).join(" · "))}</span><button class="btn primary" id="sNext" style="margin-top:12px">Seuraava sana →</button>`;
      $("#sNext").onclick = () => gSnow(s);
    } else if (miss >= 7) {
      over = true; speak(word); srsTouch(w.id, false);
      $("#sFb").className = "feedback bad"; $("#sFb").innerHTML = `Lumiukko suli… Sana oli <span class="sol">${esc(word)}</span><button class="btn primary" id="sNext" style="margin-top:12px">Uusi peli</button>`;
      $("#sNext").onclick = () => gSnow(0);
    }
  }
  $("#sKbd").onclick = e => { const b = e.target.closest("button"); if (b) guess(b.dataset.c); };
  const key = e => { if (current === "play" && ALPHA.includes(e.key.toLowerCase())) guess(e.key.toLowerCase()); };
  document.addEventListener("keydown", key); Game.stop = () => document.removeEventListener("keydown", key);
}

      setTimeout(q, 160);

/* --- Kirjainsekoitus --- */
function gAnagram() {
  const p = needPool(4, ["N", "A", "V"]); if (!p) return;
  const cand = shuffle(p.filter(w => /^[a-zõäöüšž]{4,10}$/.test(w.et))).slice(0, 8);
  if (cand.length < 3) { toast("Valitse lisää kappaleita"); return; }
  let i = 0, score = 0;
  gameShell("Kirjainsekoitus", `<div class="panel qcard" id="aCard"></div>`); quitTo();
  $("#gBest").textContent = "Ennätys " + (state.best.anagram || 0) + "/8";
  function round() {
    if (i >= cand.length) {
      setBest("anagram", score); addXP(score * 4);
      $("#aCard").innerHTML = `<div class="eyebrow">Valmis</div><div class="score" style="font-size:56px;font-weight:700">${score}/${cand.length}</div><button class="btn primary" id="aAgain">Uudestaan</button>`;
      $("#aAgain").onclick = gAnagram; return;
    }
    const w = cand[i]; let letters = shuffle([...w.et]); if (letters.join("") === w.et) letters = letters.reverse();
    let built = [];
    $("#aCard").innerHTML = `<div class="prompt-l">Sana ${i + 1}/${cand.length} · ${TYPE_FI[w.t]}</div><div class="prompt fi">${esc(noteFi(w.fi))}</div>
      <div class="builder" id="aBuilt"></div><div class="pool" id="aPool">${letters.map((c, k) => `<button class="wtile" data-k="${k}">${c}</button>`).join("")}</div>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="aUndo">Peru</button><button class="btn" id="aSkip">Ohita</button></div><div class="feedback" id="aFb"></div>`;
    const draw = () => { $("#aBuilt").innerHTML = built.map(k => `<span class="wtile">${letters[k]}</span>`).join(""); $$("#aPool .wtile").forEach(b => b.classList.toggle("used", built.includes(+b.dataset.k))); };
    const check = () => {
      if (built.length < letters.length) return;
      const s = built.map(k => letters[k]).join("");
      if (s === w.et) { score++; sfx("ok"); speak(w.et); srsTouch(w.id, true); $("#aFb").className = "feedback good"; $("#aFb").innerHTML = "Õige! " + esc(w.et); i++; setTimeout(round, 900); }
      else { sfx("bad"); $("#aBuilt").classList.add("shake"); setTimeout(() => { built = []; draw(); $("#aBuilt").classList.remove("shake"); }, 400); }
    };
    $("#aPool").onclick = e => { const b = e.target.closest(".wtile"); if (!b || b.classList.contains("used")) return; built.push(+b.dataset.k); sfx("pop"); draw(); check(); };
    $("#aUndo").onclick = () => { built.pop(); draw(); };
    $("#aSkip").onclick = () => { srsTouch(w.id, false); $("#aFb").className = "feedback bad"; $("#aFb").innerHTML = `Sana oli <span class="sol">${esc(w.et)}</span>`; speak(w.et); i++; setTimeout(round, 1300); };
  }
  round();
}

/* --- Kello --- */
const H_ET = ["", "üks", "kaks", "kolm", "neli", "viis", "kuus", "seitse", "kaheksa", "üheksa", "kümme", "üksteist", "kaksteist"];
const MIN_NOM = { 5: "viis minutit", 10: "kümme minutit", 20: "kakskümmend minutit", 25: "kakskümmend viis minutit" };
const MIN_GEN = { 5: "viie minuti", 10: "kümne minuti", 20: "kahekümne minuti", 25: "kahekümne viie minuti" };
function timeEt(h, m) {
  const nx = h % 12 + 1;
  if (m === 0) return "kell " + H_ET[h];
  if (m === 15) return "veerand " + H_ET[nx];
  if (m === 30) return "pool " + H_ET[nx];
  if (m === 45) return "kolmveerand " + H_ET[nx];
  if (m < 30) return MIN_NOM[m] + " " + H_ET[h] + " läbi";
  return MIN_GEN[60 - m] + " pärast " + H_ET[nx];
}
function clockSVG(h, m) {
  const ma = m * 6, ha = (h % 12) * 30 + m * .5;
  const ticks = Array.from({ length: 12 }, (_, i) => `<line x1="100" y1="14" x2="100" y2="${i % 3 ? 22 : 28}" transform="rotate(${i * 30} 100 100)" stroke="var(--ink)" stroke-width="${i % 3 ? 2 : 4}" stroke-linecap="round"/>`).join("");
  return `<svg class="clock" viewBox="0 0 200 200" aria-label="Kello"><circle cx="100" cy="100" r="94" fill="var(--surface)" stroke="var(--line)" stroke-width="4"/>${ticks}
  <line x1="100" y1="100" x2="100" y2="52" stroke="var(--ink)" stroke-width="7" stroke-linecap="round" transform="rotate(${ha} 100 100)"/>
  <line x1="100" y1="100" x2="100" y2="28" stroke="var(--blue)" stroke-width="4" stroke-linecap="round" transform="rotate(${ma} 100 100)"/><circle cx="100" cy="100" r="6" fill="var(--wheat)"/></svg>`;
}
function gClock() {
  const MS = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55];
  const qs = Array.from({ length: 10 }, () => {
    const h = 1 + (Math.random() * 12 | 0), m = pick(MS); const ans = timeEt(h, m);
    const set = new Set([ans]);
    const tries = [[h % 12 + 1, m], [h === 1 ? 12 : h - 1, m], [h, pick(MS)], [h, (m + 30) % 60]];
    if (m === 15 || m === 30 || m === 45) set.add((m === 15 ? "veerand " : m === 30 ? "pool " : "kolmveerand ") + H_ET[h]);
    for (const [a, b] of shuffle(tries)) { if (set.size >= 4) break; set.add(timeEt(a, b)); }
    while (set.size < 4) set.add(timeEt(1 + (Math.random() * 12 | 0), pick(MS)));
    const digital = h + "." + String(m).padStart(2, "0");
    return { kind: "mc", label: "Lue kello", html: clockSVG(h, m), optEt: true, options: shuffle([...set].slice(0, 4)), answer: ans, explain: digital + " = " + ans, speakAfter: "Kell on " + ans.replace(/^kell /, "") };
  });
  runSession({ title: "Mis kell on?", qs, key: "clock", back: gameBack, again: gClock });
}

/* --- Numerot --- */
const O_ET = ["null", "üks", "kaks", "kolm", "neli", "viis", "kuus", "seitse", "kaheksa", "üheksa"];
function numEt(n) {
  if (n < 10) return O_ET[n];
  if (n === 10) return "kümme";
  if (n < 20) return O_ET[n - 10] + "teist";
  if (n < 100) { const t = n / 10 | 0, o = n % 10; return O_ET[t] + "kümmend" + (o ? " " + O_ET[o] : ""); }
  if (n < 1000) { const h = n / 100 | 0, r = n % 100; return (h === 1 ? "sada" : O_ET[h] + "sada") + (r ? " " + numEt(r) : ""); }
  const t = n / 1000 | 0, r = n % 1000; return (t === 1 ? "tuhat" : numEt(t) + " tuhat") + (r ? " " + numEt(r) : "");
}
function gNumbers() {
  const qs = Array.from({ length: 10 }, (_, k) => {
    const max = k < 4 ? 20 : k < 7 ? 100 : 2030;
    const n = Math.random() * max | 0; const set = new Set([numEt(n)]);
    const near = [n + 1, n - 1, n + 10, n - 10, +String(n).split("").reverse().join(""), n + 100, n + 2].filter(x => x >= 0 && x !== n);
    for (const x of shuffle(near)) { if (set.size >= 4) break; set.add(numEt(x)); }
    while (set.size < 4) set.add(numEt(Math.random() * max | 0));
    return { kind: "mc", label: "Valitse oikea luku sanoina", prompt: String(n), options: shuffle([...set]), optEt: true, answer: numEt(n), speakAfter: numEt(n) };
  });
  runSession({ title: "Numerovisa", qs, key: "numbers", back: gameBack, again: gNumbers });
}

/* ================= DICTIONARY ================= */
function renderDict() {
  const v = $("#v-dict");
  v.innerHTML = `${pageBanner("rye", "Sõnavara", "Sanasto", `${WORDS.length} sanaa ja fraasia. Avaa sana, niin näet kaikki sijamuodot. Taustalla ruispelto ja ruiskukat.`)}
  <div class="dict-search"><input id="dQ" placeholder="Hae viroksi tai suomeksi…" aria-label="Hae"><select id="dT" aria-label="Sanaluokka"><option value="">Kaikki</option><option value="N">Substantiivit</option><option value="A">Adjektiivit</option><option value="V">Verbit</option><option value="X">Muut</option><option value="P">Fraasit</option><option value="FF">Väärät ystävät</option></select></div><div class="vocab" id="dList"></div>`;
  const draw = () => {
    const q = loose($("#dQ").value), t = $("#dT").value;
    const res = WORDS.filter(w => (!t || (t === "FF" ? isFalse(w.fi) : w.t === t)) && (!q || loose(w.et).includes(q) || loose(w.fi).includes(q) || w.f.some(x => loose(x) === q))).slice(0, 150);
    $("#dList").innerHTML = res.map(w => `<div class="vrow" data-id="${w.id}" style="cursor:pointer">${spk(mainEt(w))}<div class="w">${esc(w.et)}<span class="tag ${w.t}">${TYPE_FI[w.t]}</span></div><div class="forms">${formsHTML(w)}</div><div class="tr">${esc(w.fi)} <span class="muted" style="font-size:12px">· kpl ${w.u}</span></div></div>`).join("") || `<p class="muted">Ei osumia.</p>`;
  };
  $("#dQ").oninput = draw; $("#dT").onchange = draw; draw();
  $("#dList").onclick = e => { const r = e.target.closest(".vrow"); if (r && !e.target.closest("[data-speak]")) wordDialog(BYID[r.dataset.id]); };
}
function wordDialog(w) {
  let rows = "";
  if (w.t === "N" || w.t === "A") {
    rows = [["nominatiivi", w.f[0], "kuka? mikä?"], ["genetiivi", w.f[1], "kenen? minkä?"], ["partitiivi", w.f[2], "ketä? mitä?"]]
      .concat(CASES.map(c => [c[1], caseForm(w, c[0]), c[3]]))
      .concat([["monikon nominatiivi", nomPl(w), "mitkä?"], ["monikon partitiivi", w.f[3] || "–", "mitä? (mon.)"]])
      .concat(w.t === "A" && w.f[4] ? [["komparatiivi", w.f[4], "-mpi"], ["superlatiivi", "kõige " + w.f[4], "-in"]] : []);
  } else if (w.t === "V") {
    rows = V_LAB.map((l, i) => [l, w.f[i], ""]).concat([["kielto (preesens)", "ei " + w.f[3], ""], ["konditionaali (mina)", w.f[3] + "ksin", "-isin"]]);
  }
  $("#dlgBody").innerHTML = `<div class="row" style="justify-content:space-between"><span class="eyebrow">Kappale ${w.u} · ${TYPE_FI[w.t]}</span><button class="iconbtn" id="dlgX" aria-label="Sulje">${IC.close}</button></div>
    <div class="row" style="margin-top:6px"><h2>${esc(w.et)}</h2>${spk(mainEt(w))}</div><p style="font-size:18px;margin:4px 0">${esc(w.fi)}</p>
    ${rows ? `<div class="tablewrap"><table class="casetable">${rows.map(r => `<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${r[2]}</td></tr>`).join("")}</table></div>${w.t !== "V" ? `<p class="muted" style="font-size:13px">Paikallissijat on muodostettu säännöllisesti genetiivistä. Illatiivista on monilla sanoilla myös lyhyt muoto (esim. kino → kinno).</p>` : `<p class="muted" style="font-size:13px">Konditionaalin muodot on johdettu preesensvartalosta.</p>`}` : ""}`;
  $("#dlgX").onclick = () => $("#dlg").close();
  $("#dlg").showModal();
}
$("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") $("#dlg").close(); });

/* ================= KÄSITTEET ================= */
let termCat = "", termQ = "";
function renderTerms() {
  const v = $("#v-terms");
  v.innerHTML = `${pageBanner("tartu", "Mõisted", "Kieliopin käsitteet", `Kaikki kirjan kielioppitermit suomeksi, viroksi ja englanniksi (kirjan termi), selitykset ja esimerkit. Taustalla Tarton yliopiston päärakennus.`)}
  <div class="row" style="margin-bottom:12px"><button class="btn primary" id="tQuiz">${IC.cap} Käsitevisa</button><button class="btn" id="tCase">${IC.table} Tunnista sija</button></div>
  <details class="panel" id="tCases"><summary><span>Sijataulukko: kaikki 14 sijaa (esimerkki <i class="et">maja</i> = talo)</span></summary><div class="inner"><table class="big"><tr><th>Sija</th><th>Viroksi</th><th>Kysymys</th><th>Yksikkö</th><th>Monikko</th><th>Suomeksi</th></tr>
    ${CASE_TABLE.map(r => `<tr><td><b>${r[0]}</b></td><td class="sm">${r[1]}</td><td class="sm">${r[2]}</td><td class="et">${r[3]}</td><td class="et">${r[4]}</td><td>${r[5]}</td></tr>`).join("")}</table>
    <p class="muted" style="font-size:14px">Kolme ensimmäistä opetellaan sanakohtaisesti. Loput 11 muodostetaan genetiivistä (<i class="et">maja-</i>, monikossa <i class="et">majade-</i>) lisäämällä pääte. Kaikki sijat ovat kappaleessa 10 käytössä.</p></div></details>
  <details class="panel"><summary><span>Verbitaulukko: kaikki muodot (esimerkki <i class="et">ootama</i> = odottaa)</span></summary><div class="inner"><table class="big"><tr><th>Tapaluokka</th><th>Muoto</th><th>Myönteinen</th><th>Kielteinen</th></tr>
    ${VERB_TABLE.map(([m, rows]) => rows.map((r, i) => `<tr><td>${i ? "" : `<b>${m}</b>`}</td><td class="sm">${r[0]}</td><td class="et">${r[1]}</td><td class="et">${r[2]}</td></tr>`).join("")).join("")}</table></div></details>
  <div class="dict-search" style="margin-top:18px"><input id="tQ" placeholder="Hae käsitettä: partitiivi, osastav, gerund…" aria-label="Hae käsitettä" value="${esc(termQ)}"></div>
  <div class="chips" id="tCats"><button class="chip" aria-pressed="${!termCat}" data-c="">Kaikki (${CONCEPTS.length})</button>${CONCEPT_CATS.map(([k, l]) => `<button class="chip" aria-pressed="${termCat === k}" data-c="${k}">${l}</button>`).join("")}</div>
  <div class="cgrid" id="tList"></div>`;
  const draw = () => {
    const q = loose(termQ);
    const list = CONCEPTS.map((c, i) => [c, i]).filter(([c]) => (!termCat || c.c === termCat) && (!q || loose(c.fi + " " + c.et + " " + c.en + " " + c.s).includes(q)));
    $("#tList").innerHTML = list.map(([c, i]) => `<article class="panel ccard" id="term-${i}"><div class="row" style="justify-content:space-between;gap:8px"><h3>${esc(c.fi)}</h3><button class="unitchip" data-unit="${c.u}" title="Avaa kappaleen kielioppi">kpl ${c.u}</button></div>
      <div class="names"><b>${esc(c.et)}</b><span>· engl. ${esc(c.en)}</span></div>
      <div class="txt">${c.t}</div>
      ${c.ex.length ? `<div class="exs">${c.ex.map(([e, f]) => `<div>${spk(e.replace(/\s*\(.*?\)/g, "").replace(/ \/ .*/, ""))}<span><span class="e">${esc(e)}</span> – ${esc(f)}</span></div>`).join("")}</div>` : ""}</article>`).join("") || `<p class="muted">Ei osumia.</p>`;
    $$("#tList [data-unit]").forEach(b => b.onclick = () => openUnit(+b.dataset.unit, "grammar"));
  };
  $("#tQ").oninput = e => { termQ = e.target.value; draw(); };
  $("#tCats").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; termCat = b.dataset.c; $$("#tCats .chip").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); };
  $("#tQuiz").onclick = () => startPractice(PRACTICE.find(m => m.k === "terms"), "terms");
  $("#tCase").onclick = () => startPractice(PRACTICE.find(m => m.k === "whichcase"), "terms");
  draw();
}
function openTerm(i) {
  termCat = ""; termQ = ""; go("terms");
  const el = $("#term-" + i); if (!el) return;
  setTimeout(() => { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1800); }, 60);
}

/* ================= SETTINGS ================= */

  const s = state.set; let armed = false;
  $("#dlgBody").innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="font-family:var(--ui);font-size:24px">Asetukset</h2><button class="iconbtn" id="dlgX" aria-label="Sulje">${IC.close}</button></div>
  <div class="settings" style="margin-top:14px">
    <label for="sTheme">Teema <select id="sTheme" class="btn sm"><option value="">Järjestelmän mukaan</option><option value="light"${s.theme === "light" ? " selected" : ""}>Vaalea</option><option value="dark"${s.theme === "dark" ? " selected" : ""}>Tumma</option></select></label>
    <label for="sGoal">Päivätavoite <select id="sGoal" class="btn sm">${[20, 40, 80, 150].map(g => `<option${s.goal === g ? " selected" : ""}>${g}</option>`).join("")}</select> XP</label>
    <label><input type="checkbox" id="sSound"${s.sound ? " checked" : ""}> Äänitehosteet</label>
    <p class="muted" style="margin:4px 0">Ääntäminen: ${VOICE ? (/^et/i.test(VOICE.lang) ? "virolainen ääni käytössä (" + esc(VOICE.name) + ")" : "virolaista ääntä ei löytynyt, käytetään suomalaista ääntä (" + esc(VOICE.name) + "). Asenna laitteeseen viron puhesynteesi, niin ääntäminen paranee.") : "laitteesta ei löytynyt puheääntä. Kokeile toista selainta, esim. Chromea tai Edgeä."}</p>
    <p class="muted" style="margin:4px 0">Tallennus: ${Cloud.ref ? "edistymisesi tallentuu tiliisi ja näkyy muillakin laitteilla" : "edistymisesi tallentuu tähän selaimeen"}.</p>
    <button class="btn" id="sReset" style="justify-self:start">Nollaa edistyminen</button>
  </div>`;
  $("#dlgX").onclick = () => $("#dlg").close();
  $("#sTheme").onchange = e => { s.theme = e.target.value; applyTheme(); save(); };
  $("#sGoal").onchange = e => { s.goal = +e.target.value; save(); renderPills(); if (current === "home") renderHome(); };
  $("#sSound").onchange = e => { s.sound = e.target.checked; save(); };
  $("#sReset").onclick = e => {
    if (!armed) { armed = true; e.target.textContent = "Vahvista: poista kaikki XP ja kortit"; e.target.style.borderColor = "var(--bad)"; e.target.style.color = "var(--bad)"; return; }
    const keep = state.set; state = DEF(); state.set = keep; save(); $("#dlg").close(); refreshAll(); toast("Edistyminen nollattu");
  };
  $("#dlg").showModal();
}

/* ================= BOOT ================= */
function boot() {
  loadLocal(); applyTheme();
  $("#brandMark").innerHTML = `<span style="color:var(--blue);display:block;width:30px;height:30px">${FLOWER()}</span>`;
  $("#nav").innerHTML = NAV.map(([k, l, ic]) => `<button data-v="${k}">${ic}<span>${l}</span></button>`).join("");
  $$("#nav button").forEach(b => b.onclick = () => go(b.dataset.v));
  $("#brand").onclick = () => go("home");
  $("#btnSettings").innerHTML = IC.gear; $("#btnSettings").onclick = openSettings;
  renderPills();
  const h = (location.hash || "").slice(1);
  go(["units", "cards", "practice", "games", "dict", "terms"].includes(h) ? h : "home");
  Cloud.init();
}
boot();
